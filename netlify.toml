# Netlify Root Configuration for Monorepo Setup
# Handles builds whether triggered from root or subfolder

[build]
  command = "cd frontend && npm install && npm run build"
  publish = "frontend/dist"

# Single Page Application (SPA) catch-all redirect
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and Best Practice Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache immutable static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
